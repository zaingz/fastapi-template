[project]
name = "fastapi-template"
version = "0.1.0"
description = "A minimal, production-ready FastAPI starter template"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Zain Zafar" }]
dependencies = [
    "fastapi[standard]>=0.138.0,<1.0",
    "gunicorn>=26.0.0",
    "structlog>=26.1.0",
    "asgi-correlation-id>=5.0.1",
    "uvicorn-worker>=0.3",
    # Shared outbound HTTP client for downstream calls (already pulled in by fastapi[standard]).
    "httpx>=0.28",
]

# Opt-in extras — NOT installed by default. The default path stays key-free and offline.
# Install a recipe's deps with e.g. `uv sync --extra redis`.
[project.optional-dependencies]
redis = ["redis>=5.0"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28",
    "ruff>=0.15.19",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "S",   # flake8-bandit (security)
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert (S101) and fixed test secrets (S106) — not security-relevant.
"tests/**" = ["S101", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
